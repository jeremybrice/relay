<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" role="img" aria-labelledby="title desc">
  <title id="title">How a lesson becomes a rule</title>
  <desc id="desc">A lesson is noticed at save, reinforced when it comes up again on a new day, and is ready after three separate days. At the next session start you decide: yes or edit writes it as a rule in AGENTS.md, not yet waits for a new day, drop retires it.</desc>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 17px; font-weight: 600; }
    .b { font-size: 14px; }
    .s { font-size: 12.5px; fill: #9198a1; }
    .n { font-size: 12.5px; font-weight: 600; fill: #9198a1; }
    .card { fill: #151b23; stroke: #3d444d; stroke-width: 1.5; }
    .ln { stroke: #7d8590; stroke-width: 2; fill: none; }
    .dash { stroke-dasharray: 6 5; }
    .purple { fill: #251a3d; stroke: #ab7df8; stroke-width: 1.5; }
    .green { fill: #122d1b; stroke: #3fb950; stroke-width: 1.5; }
    .on { fill: #ab7df8; }
    .off { fill: none; stroke: #ab7df8; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="#0d1117"/>

  <!-- 1 Noticed -->
  <rect class="card" x="20" y="30" width="190" height="120" rx="12"/>
  <text class="t n" x="38" y="56">1</text>
  <text class="t h" x="54" y="57">Noticed</text>
  <circle class="on" cx="45" cy="80" r="6"/><circle class="off" cx="63" cy="80" r="6"/><circle class="off" cx="81" cy="80" r="6"/>
  <text class="t s" x="95" y="85">1 day</text>
  <text class="t s" x="38" y="112">captured at save</text>
  <text class="t s" x="38" y="130">from your session</text>

  <line class="ln" x1="213" y1="90" x2="252" y2="90" marker-end="url(#arrow)"/>

  <!-- 2 Reinforced -->
  <rect class="card" x="258" y="30" width="190" height="120" rx="12"/>
  <text class="t n" x="276" y="56">2</text>
  <text class="t h" x="292" y="57">Reinforced</text>
  <circle class="on" cx="283" cy="80" r="6"/><circle class="on" cx="301" cy="80" r="6"/><circle class="off" cx="319" cy="80" r="6"/>
  <text class="t s" x="333" y="85">2 days</text>
  <text class="t s" x="276" y="112">seen again on a new day</text>
  <text class="t s" x="276" y="130">same day doesn't count</text>

  <line class="ln" x1="451" y1="90" x2="490" y2="90" marker-end="url(#arrow)"/>

  <!-- 3 Ready -->
  <rect class="purple" x="496" y="30" width="190" height="120" rx="12"/>
  <text class="t n" x="514" y="56">3</text>
  <text class="t h" x="530" y="57">Ready</text>
  <circle class="on" cx="521" cy="80" r="6"/><circle class="on" cx="539" cy="80" r="6"/><circle class="on" cx="557" cy="80" r="6"/>
  <text class="t s" x="571" y="85">3 days</text>
  <text class="t s" x="514" y="112">asked about once, at</text>
  <text class="t s" x="514" y="130">the next session start</text>

  <!-- 4 Graduated -->
  <rect class="green" x="734" y="30" width="190" height="120" rx="12"/>
  <text class="t n" x="752" y="56">4</text>
  <text class="t h" x="768" y="57">A rule</text>
  <rect x="753" y="69" width="18" height="22" rx="2" fill="none" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="757" y1="76" x2="767" y2="76" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="757" y1="81" x2="767" y2="81" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="757" y1="86" x2="764" y2="86" stroke="#3fb950" stroke-width="1.5"/>
  <text class="t s m" x="781" y="85">AGENTS.md</text>
  <text class="t s" x="752" y="112">one line, in wording</text>
  <text class="t s" x="752" y="130">you approved</text>

  <!-- decision -->
  <line class="ln" x1="591" y1="152" x2="591" y2="186" marker-end="url(#arrow)"/>
  <rect class="card" x="446" y="192" width="290" height="40" rx="20"/>
  <text class="t b" x="591" y="217" text-anchor="middle">you decide: yes · edit · not yet · drop</text>

  <path class="ln" d="M738,212 L829,212 L829,156" marker-end="url(#arrow)"/>
  <text class="t s" x="784" y="232" text-anchor="middle">yes / edit</text>

  <path class="ln dash" d="M444,212 L353,212 L353,156" marker-end="url(#arrow)"/>
  <text class="t s" x="398" y="256" text-anchor="middle">not yet: waits for</text>
  <text class="t s" x="398" y="273" text-anchor="middle">a new day</text>

  <text class="t s" x="591" y="256" text-anchor="middle">drop: retired</text>
</svg>
